<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <radialGradient id="cloudGlow" cx="20%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bioGlow" cx="50%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bizGlow" cx="80%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base & Glows -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <rect width="1200" height="675" fill="url(#cloudGlow)" />
  <rect width="1200" height="675" fill="url(#bioGlow)" />
  <rect width="1200" height="675" fill="url(#bizGlow)" />

  <!-- Connecting Backbone Circuit Lines -->
  <path d="M 240 330 C 380 330, 420 380, 600 380 C 780 380, 820 310, 960 310" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" />
  <path d="M 240 330 L 600 240 L 960 310" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 600 240 L 600 500" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Central Hub Node -->
  <circle cx="600" cy="240" r="42" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <circle cx="600" cy="240" r="16" fill="#38BDF8" fill-opacity="0.8" />

  <!-- Node 1: Cloud & Model Distribution (Left) -->
  <g transform="translate(140, 240)">
    <rect width="220" height="180" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <path d="M 30 42 C 28 42 26 40 26 38 C 26 36 28 34 30 34 C 31 31 34 29 38 29 C 42 29 45 32 46 35 C 48 35 50 37 50 39 C 50 41 48 42 46 42 Z" fill="#38BDF8" />
    <text x="20" y="85" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Cloud Distribution</text>
    <text x="20" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Model Marketplaces</text>
    <text x="20" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">&amp; Enterprise Spend</text>
    <rect x="20" y="145" width="76" height="18" rx="4" fill="#0369A1" fill-opacity="0.3" />
    <text x="28" y="158" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PROCUREMENT</text>
  </g>

  <!-- Node 2: Biotech & Life Sciences (Center Bottom) -->
  <g transform="translate(490, 390)">
    <rect width="220" height="180" rx="16" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-width="1" />
    <!-- Stylized DNA / Molecular icon -->
    <circle cx="32" cy="34" r="3" fill="#34D399" />
    <circle cx="44" cy="42" r="3" fill="#34D399" />
    <line x1="32" y1="34" x2="44" y2="42" stroke="#34D399" stroke-width="2" />
    <circle cx="44" cy="34" r="3" fill="#34D399" />
    <circle cx="32" cy="42" r="3" fill="#34D399" />
    <line x1="44" y1="34" x2="32" y2="42" stroke="#34D399" stroke-width="2" />
    <text x="20" y="85" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Life Sciences</text>
    <text x="20" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Drug Development</text>
    <text x="20" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">&amp; Study Tracking</text>
    <rect x="20" y="145" width="80" height="18" rx="4" fill="#065F46" fill-opacity="0.3" />
    <text x="28" y="158" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">COORDINATION</text>
  </g>

  <!-- Node 3: Conversational Discovery & Ads (Right) -->
  <g transform="translate(840, 220)">
    <rect width="220" height="180" rx="16" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#4F46E5" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" />
    <!-- Chat / Megaphone graphic -->
    <path d="M 28 32 L 44 32 C 46 32 48 34 48 36 L 48 42 C 48 44 46 46 44 46 L 36 46 L 30 50 L 30 46 L 28 46 C 26 46 24 44 24 42 L 24 36 C 24 34 26 32 28 32 Z" fill="#818CF8" />
    <text x="20" y="85" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Business Discovery</text>
    <text x="20" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Conversational Ads</text>
    <text x="20" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">&amp; Market Expansion</text>
    <rect x="20" y="145" width="84" height="18" rx="4" fill="#3730A3" fill-opacity="0.3" />
    <text x="28" y="158" fill="#818CF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">DISTRIBUTION</text>
  </g>

  <!-- Editorial Masthead Header on Graphic -->
  <g transform="translate(80, 80)">
    <rect width="180" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="16" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AI FOUNDERS TALK</text>
    <text x="0" y="58" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Weekly Intelligence Digest</text>
    <text x="0" y="84" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Cross-Industry Analysis: Cloud, Biotech, Discovery &amp; Governance</text>
  </g>

  <!-- Footer Meta -->
  <text x="80" y="625" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">October 19–22, 2026 Edition • Original Editorial Synthesis</text>
</svg>